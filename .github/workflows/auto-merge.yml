name: Auto-merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: PR number to merge
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number || inputs.pull_number || github.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pull_number }}
        run: |
          set -euo pipefail
          state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$state" = "MERGED" ]; then
            echo "PR #$PR already merged"
            exit 0
          fi
          if [ "$state" != "OPEN" ]; then
            echo "PR #$PR is $state, skip"
            exit 0
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
